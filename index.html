<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketing Activity Dashboard</title>
<style>
  :root{
    --bg:#f5f7fa; --panel:#ffffff; --ink:#1a2233; --muted:#66738a;
    --line:#e3e8ef; --brand:#2f6df6; --brand-soft:#eaf1ff;
    --chip:#eef1f6; --good:#1f9d63; --warn:#c9820b; --bad:#d0492f;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.10);
    --radius:12px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0f141b; --panel:#161d27; --ink:#e8edf4; --muted:#95a2b5;
      --line:#26303d; --brand:#5b8dff; --brand-soft:#1a2536;
      --chip:#1e2833; --good:#3fca86; --warn:#e0a53a; --bad:#f0765a;
      --shadow:0 1px 2px rgba(0,0,0,.3);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header.top{
    padding:20px 24px 14px; border-bottom:1px solid var(--line);
    background:var(--panel);
  }
  header.top h1{margin:0;font-size:20px;letter-spacing:-.01em}
  header.top p{margin:4px 0 0;color:var(--muted);font-size:13px}
  .wrap{max-width:1400px;margin:0 auto;padding:20px 24px 60px}

  /* KPI row */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
  .kpi .n{font-size:24px;font-weight:650;letter-spacing:-.02em}
  .kpi .l{color:var(--muted);font-size:12px;margin-top:2px;text-transform:uppercase;letter-spacing:.04em}

  /* Filters */
  .filters{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:16px;margin-bottom:18px;
  }
  .filters-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .filters-head h2{margin:0;font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
  .field{position:relative}
  .field > label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}

  /* searchable dropdown */
  .sd{position:relative}
  .sd .box{
    display:flex;align-items:center;gap:6px;width:100%;min-height:38px;
    border:1px solid var(--line);border-radius:9px;background:var(--bg);
    padding:6px 10px;cursor:pointer;user-select:none;
  }
  .sd .box .val{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sd .box .val.placeholder{color:var(--muted)}
  .sd .box .clear{color:var(--muted);font-size:16px;line-height:1;padding:0 2px;border-radius:4px}
  .sd .box .clear:hover{color:var(--bad)}
  .sd .box .caret{color:var(--muted);font-size:10px}
  .sd.open .box{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .sd .menu{
    position:absolute;z-index:40;top:calc(100% + 4px);left:0;right:0;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    box-shadow:0 8px 24px rgba(16,24,40,.16);max-height:300px;display:none;flex-direction:column;overflow:hidden;
  }
  .sd.open .menu{display:flex}
  .sd .menu input{border:0;border-bottom:1px solid var(--line);padding:9px 11px;background:transparent;color:var(--ink);font-size:13px;outline:none}
  .sd .opts{overflow-y:auto;padding:4px}
  .sd .opts .opt{padding:7px 9px;border-radius:6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sd .opts .opt:hover{background:var(--brand-soft)}
  .sd .opts .opt.sel{background:var(--brand-soft);font-weight:600}
  .sd .opts .opt .cnt{color:var(--muted);font-weight:400;font-size:12px;float:right;margin-left:8px}
  .sd .opts .none{padding:10px;color:var(--muted);font-size:13px}

  input[type=date]{
    width:100%;min-height:38px;border:1px solid var(--line);border-radius:9px;
    background:var(--bg);color:var(--ink);padding:6px 10px;font:inherit;
  }
  input[type=date]:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);outline:none}
  .daterow{display:flex;gap:8px}
  .daterow > div{flex:1}
  .daterow .sub{font-size:10px;color:var(--muted);margin-bottom:3px}

  button.btn{
    font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--ink);
    padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;
  }
  button.btn:hover{border-color:var(--brand);color:var(--brand)}
  button.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  button.btn.primary:hover{opacity:.92;color:#fff}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap}

  /* Results */
  .results{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .results-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .results-head .count{font-weight:650}
  .results-head .count span{color:var(--muted);font-weight:400}
  .tablescroll{overflow-x:auto;max-height:70vh;overflow-y:auto}
  table{border-collapse:collapse;width:100%;font-size:13px}
  thead th{
    position:sticky;top:0;background:var(--panel);text-align:left;padding:10px 12px;
    border-bottom:2px solid var(--line);white-space:nowrap;color:var(--muted);
    font-size:11px;text-transform:uppercase;letter-spacing:.03em;z-index:5;
  }
  tbody td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
  tbody tr:hover{background:var(--brand-soft)}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600}
  .pill.Completed{background:rgba(31,157,99,.14);color:var(--good)}
  .pill.Expired{background:rgba(201,130,11,.14);color:var(--warn)}
  .pill.Rejected{background:rgba(208,73,47,.14);color:var(--bad)}
  .pill.Yes{background:rgba(31,157,99,.14);color:var(--good)}
  .pill.No{background:var(--chip);color:var(--muted)}
  .pager{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px}
  .pager button{min-width:36px}
  .pager .info{color:var(--muted);font-size:13px}

  .loading{padding:60px;text-align:center;color:var(--muted)}
  .spinner{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .empty{padding:50px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header class="top">
  <h1>Marketing Activity Dashboard</h1>
  <p id="subtitle">Loading data…</p>
</header>

<div class="wrap">
  <div id="app" class="loading">
    <div class="spinner"></div>
    Loading activity records…
  </div>

  <template id="ui">
    <div class="kpis" id="kpis"></div>

    <div class="filters">
      <div class="filters-head">
        <h2>Filters</h2>
        <div class="btnrow">
          <button class="btn" id="reset">Reset all</button>
          <button class="btn primary" id="export">Export results (CSV)</button>
        </div>
      </div>
      <div class="grid" id="filterGrid"></div>
    </div>

    <div class="results">
      <div class="results-head">
        <div class="count" id="count"></div>
      </div>
      <div class="tablescroll">
        <table>
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="pager" id="pager"></div>
    </div>
  </template>
</div>

<script>
"use strict";

// ---- Configuration -------------------------------------------------------
// Which columns become filters, and how each behaves.
const FILTERS = [
  {key:"employee", label:"Employee Name", col:"Employee Name"},
  {key:"designation", label:"Designation", col:"Designation"},
  {key:"zone", label:"Zone", col:"Zone"},
  {key:"region", label:"Region", col:"Region"},
  {key:"territory", label:"Territory", col:"Territory"},
  {key:"district", label:"District", col:"District"},
  {key:"activity", label:"Activity", col:"Activity"},
  {key:"activityType", label:"Activity Type", col:"Activity Type"},
  {key:"productCategory", label:"Product Category", col:"Product Category"},
  {key:"product", label:"Product", col:"Product"},
  {key:"status", label:"Status", col:"Status"},
  {key:"achieved", label:"Achieved", col:"Achieved"},
];
// Columns shown in the results table (in order).
const TABLE_COLS = ["Planned Date","Employee Name","Designation","Zone","Region",
  "Territory","District","Activity","Activity Type","Product Category","Product","Status","Achieved"];
const PAGE_SIZE = 100;

// ---- State ---------------------------------------------------------------
let COLS=[], ROWS=[], IDX={};      // raw data
let selected={};                    // key -> chosen value ("" = any)
let dateFrom="", dateTo="";
let filtered=[];                    // current filtered rows
let page=0;

const nf = new Intl.NumberFormat("en-US");

// ---- Load ----------------------------------------------------------------
fetch("data.json").then(r=>{
  if(!r.ok) throw new Error("Could not load data.json ("+r.status+")");
  return r.json();
}).then(data=>{
  COLS=data.columns; ROWS=data.rows;
  COLS.forEach((c,i)=>IDX[c]=i);
  boot();
}).catch(err=>{
  document.getElementById("app").innerHTML =
    '<div class="empty"><b>Couldn\'t load the data.</b><br>'+err.message+
    '<br><br>This page needs to be opened through a web server (e.g. GitHub Pages), not by double-clicking the file.</div>';
  document.getElementById("subtitle").textContent="Data failed to load";
});

// ---- Boot / build UI -----------------------------------------------------
function boot(){
  const app=document.getElementById("app");
  app.className="";
  app.innerHTML="";
  app.appendChild(document.getElementById("ui").content.cloneNode(true));

  document.getElementById("subtitle").textContent =
    nf.format(ROWS.length)+" activity records loaded";

  // date bounds
  const di=IDX["Planned Date"];
  let mn="9999", mx="0000";
  for(const r of ROWS){const d=r[di]; if(d){ if(d<mn)mn=d; if(d>mx)mx=d; }}
  DATE_MIN=mn; DATE_MAX=mx;

  buildFilters();
  apply();
}
let DATE_MIN="", DATE_MAX="";

function buildFilters(){
  const grid=document.getElementById("filterGrid");
  FILTERS.forEach(f=>{
    const wrap=document.createElement("div");
    wrap.className="field";
    wrap.innerHTML='<label>'+f.label+'</label>';
    wrap.appendChild(makeSearchable(f));
    grid.appendChild(wrap);
  });
  // date range field
  const dr=document.createElement("div");
  dr.className="field";
  dr.innerHTML='<label>Date range (Planned Date)</label>'+
    '<div class="daterow">'+
      '<div><div class="sub">From</div><input type="date" id="dateFrom" min="'+DATE_MIN+'" max="'+DATE_MAX+'"></div>'+
      '<div><div class="sub">To</div><input type="date" id="dateTo" min="'+DATE_MIN+'" max="'+DATE_MAX+'"></div>'+
    '</div>';
  document.getElementById("filterGrid").appendChild(dr);
  dr.querySelector("#dateFrom").addEventListener("change",e=>{dateFrom=e.target.value;page=0;apply();});
  dr.querySelector("#dateTo").addEventListener("change",e=>{dateTo=e.target.value;page=0;apply();});

  document.getElementById("reset").addEventListener("click",resetAll);
  document.getElementById("export").addEventListener("click",exportCsv);
}

// Searchable single-select dropdown -----------------------------------------
function makeSearchable(f){
  const ci=IDX[f.col];
  const root=document.createElement("div");
  root.className="sd";
  root.innerHTML=
    '<div class="box"><span class="val placeholder">Any</span>'+
    '<span class="clear" title="Clear" style="display:none">&times;</span>'+
    '<span class="caret">&#9662;</span></div>'+
    '<div class="menu"><input type="text" placeholder="Search '+f.label.toLowerCase()+'…">'+
    '<div class="opts"></div></div>';
  const box=root.querySelector(".box");
  const valEl=root.querySelector(".val");
  const clearEl=root.querySelector(".clear");
  const search=root.querySelector("input");
  const opts=root.querySelector(".opts");

  f._ci=ci; f._root=root; f._valEl=valEl; f._clearEl=clearEl; f._search=search; f._opts=opts;

  box.addEventListener("click",e=>{
    if(e.target===clearEl) return;
    const willOpen=!root.classList.contains("open");
    closeAll();
    if(willOpen){root.classList.add("open"); search.value=""; renderOpts(f); search.focus();}
  });
  clearEl.addEventListener("click",e=>{e.stopPropagation(); setSel(f,"");});
  search.addEventListener("input",()=>renderOpts(f));
  return root;
}

function renderOpts(f){
  // distinct values available given ALL OTHER active filters (cascading), with counts
  const counts=new Map();
  for(const r of ROWS){
    if(!passesExcept(r,f.key)) continue;
    const v=r[f._ci];
    if(!v) continue;
    counts.set(v,(counts.get(v)||0)+1);
  }
  let list=[...counts.keys()];
  const q=f._search.value.trim().toLowerCase();
  if(q) list=list.filter(v=>v.toLowerCase().includes(q));
  list.sort((a,b)=>a.localeCompare(b,undefined,{numeric:true,sensitivity:"base"}));
  const cur=selected[f.key]||"";
  const box=f._opts;
  if(!list.length){box.innerHTML='<div class="none">No matches</div>';return;}
  const frag=document.createDocumentFragment();
  list.slice(0,500).forEach(v=>{
    const d=document.createElement("div");
    d.className="opt"+(v===cur?" sel":"");
    d.innerHTML='<span>'+esc(v)+'</span><span class="cnt">'+nf.format(counts.get(v))+'</span>';
    d.addEventListener("click",()=>setSel(f,v));
    frag.appendChild(d);
  });
  if(list.length>500){
    const m=document.createElement("div");m.className="none";
    m.textContent=nf.format(list.length-500)+" more… keep typing to narrow down";
    frag.appendChild(m);
  }
  box.innerHTML=""; box.appendChild(frag);
}

function setSel(f,v){
  selected[f.key]=v;
  f._valEl.textContent = v || "Any";
  f._valEl.classList.toggle("placeholder", !v);
  f._clearEl.style.display = v ? "inline" : "none";
  closeAll();
  page=0;
  apply();
}

function closeAll(){document.querySelectorAll(".sd.open").forEach(el=>el.classList.remove("open"));}
document.addEventListener("click",e=>{ if(!e.target.closest(".sd")) closeAll(); });

// ---- Filtering -----------------------------------------------------------
function passesExcept(r, skipKey){
  for(const f of FILTERS){
    if(f.key===skipKey) continue;
    const want=selected[f.key];
    if(want && r[f._ci]!==want) return false;
  }
  const d=r[IDX["Planned Date"]];
  if(dateFrom && (!d || d<dateFrom)) return false;
  if(dateTo   && (!d || d>dateTo))   return false;
  return true;
}
function passes(r){ return passesExcept(r,null); }

function apply(){
  filtered=ROWS.filter(passes);
  renderKpis();
  renderTable();
}

// ---- KPIs ----------------------------------------------------------------
function renderKpis(){
  const si=IDX["Status"], ai=IDX["Achieved"], ei=IDX["Employee Name"];
  let completed=0, achieved=0; const emps=new Set();
  for(const r of filtered){
    if(r[si]==="Completed") completed++;
    if(r[ai]==="Yes") achieved++;
    if(r[ei]) emps.add(r[ei]);
  }
  const n=filtered.length;
  const pct=x=> n? Math.round(x/n*100)+"%" : "–";
  const kpis=[
    {n:nf.format(n), l:"Results"},
    {n:nf.format(completed)+" · "+pct(completed), l:"Completed"},
    {n:nf.format(achieved)+" · "+pct(achieved), l:"Achieved"},
    {n:nf.format(emps.size), l:"Employees"},
  ];
  document.getElementById("kpis").innerHTML =
    kpis.map(k=>'<div class="kpi"><div class="n">'+k.n+'</div><div class="l">'+k.l+'</div></div>').join("");
}

// ---- Table ---------------------------------------------------------------
function renderTable(){
  const thead=document.getElementById("thead");
  thead.innerHTML="<tr>"+TABLE_COLS.map(c=>"<th>"+esc(c)+"</th>").join("")+"</tr>";

  const tbody=document.getElementById("tbody");
  const total=filtered.length;
  const pages=Math.max(1,Math.ceil(total/PAGE_SIZE));
  if(page>=pages) page=pages-1;
  const start=page*PAGE_SIZE;
  const slice=filtered.slice(start, start+PAGE_SIZE);

  if(!total){
    tbody.innerHTML='<tr><td colspan="'+TABLE_COLS.length+'"><div class="empty">No records match these filters.</div></td></tr>';
  }else{
    const rows=slice.map(r=>{
      return "<tr>"+TABLE_COLS.map(c=>{
        const v=r[IDX[c]]||"";
        if(c==="Status") return "<td>"+(v?'<span class="pill '+v+'">'+v+"</span>":"")+"</td>";
        if(c==="Achieved") return "<td>"+(v?'<span class="pill '+v+'">'+v+"</span>":"")+"</td>";
        return "<td title=\""+esc(v)+"\">"+esc(v)+"</td>";
      }).join("")+"</tr>";
    }).join("");
    tbody.innerHTML=rows;
  }

  document.getElementById("count").innerHTML =
    nf.format(total)+" record"+(total===1?"":"s")+" <span>match your filters</span>";

  // pager
  const pager=document.getElementById("pager");
  if(total<=PAGE_SIZE){ pager.innerHTML=""; return; }
  pager.innerHTML=
    '<button class="btn" id="prev" '+(page===0?"disabled":"")+'>&larr; Prev</button>'+
    '<span class="info">Showing '+nf.format(start+1)+'–'+nf.format(Math.min(start+PAGE_SIZE,total))+
      ' of '+nf.format(total)+' (page '+(page+1)+' of '+nf.format(pages)+')</span>'+
    '<button class="btn" id="next" '+(page>=pages-1?"disabled":"")+'>Next &rarr;</button>';
  const pv=pager.querySelector("#prev"), nx=pager.querySelector("#next");
  if(pv) pv.onclick=()=>{if(page>0){page--;renderTable();scrollTop();}};
  if(nx) nx.onclick=()=>{if(page<pages-1){page++;renderTable();scrollTop();}};
}
function scrollTop(){document.querySelector(".tablescroll").scrollTop=0;}

// ---- Reset / Export ------------------------------------------------------
function resetAll(){
  selected={}; dateFrom=""; dateTo=""; page=0;
  FILTERS.forEach(f=>{f._valEl.textContent="Any";f._valEl.classList.add("placeholder");f._clearEl.style.display="none";});
  const a=document.getElementById("dateFrom"), b=document.getElementById("dateTo");
  if(a)a.value=""; if(b)b.value="";
  apply();
}

function exportCsv(){
  const cols=COLS; // export all kept columns
  const head=cols.map(csvCell).join(",");
  const lines=filtered.map(r=>cols.map((c,i)=>csvCell(r[i])).join(","));
  const blob=new Blob([head+"\n"+lines.join("\n")],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download="filtered_activities_"+new Date().toISOString().slice(0,10)+".csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function csvCell(v){v=(v==null?"":String(v)); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}

// ---- utils ---------------------------------------------------------------
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
</script>
</body>
</html>
